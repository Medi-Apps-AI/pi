name: Fork Binary Release

# Fork-specific release flow: pushing a v* tag publishes a GitHub Release
# carrying self-contained pi binaries built via scripts/build-binaries.sh.
#
# Consumer contract: downstream CI pins <tag> + asset name `pi-linux-x64`
# and fetches it with `gh release download <tag> -p 'pi-linux-x64'`.
# Renaming assets is a breaking change.
#
# Note: a bare compiled binary reports `0.0.0` from `--version` because the
# version is read from a package.json placed next to the executable (see
# packages/coding-agent/src/config.ts getPackageDir). The full sidecar layout
# from pi-<platform>.tar.gz reports the real version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g., v0.80.7-medi.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-binary-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      # npm ci (frozen lockfile) + full package build + bun compile happen
      # inside the script; reuse them for the second platform.
      - name: Build linux-x64 binary
        run: ./scripts/build-binaries.sh --platform linux-x64

      - name: Build darwin-arm64 binary
        run: ./scripts/build-binaries.sh --platform darwin-arm64 --skip-install --skip-deps --skip-build --out packages/coding-agent/binaries-darwin

      - name: Collect release assets
        run: |
          set -euo pipefail
          cp packages/coding-agent/binaries/linux-x64/pi pi-linux-x64
          cp packages/coding-agent/binaries-darwin/darwin-arm64/pi pi-darwin-arm64

      - name: Sanity check
        run: |
          set -euo pipefail
          # Bare binary must execute standalone (prints 0.0.0, see header note).
          ./pi-linux-x64 --version
          # Full layout reports the real package version.
          (cd packages/coding-agent/binaries/linux-x64 && ./pi --version)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" pi-linux-x64 pi-darwin-arm64 --verify-tag --title "$RELEASE_TAG" --generate-notes
